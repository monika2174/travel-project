<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Destinations – TravelBooking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-globe2"></i> TravelBooking</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="destinations.html">Destinations</a></li>
        <li class="nav-item"><a class="nav-link" href="hotels.html">Hotels</a></li>
        <li class="nav-item"><a class="nav-link" href="trips.html">Trips</a></li>
      </ul>
      <div id="authButtons">
        <a href="login.html" class="btn btn-outline-light btn-sm me-2">Login</a>
        <a href="register.html" class="btn btn-primary btn-sm">Register</a>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h2 class="mb-4">Destinations</h2>
  <div class="row mb-4">
    <div class="col-md-6">
      <input type="text" class="form-control" id="searchInput" placeholder="Search destinations...">
    </div>
    <div class="col-md-4">
      <input type="text" class="form-control" id="countryFilter" placeholder="Filter by country">
    </div>
    <div class="col-md-2">
      <button class="btn btn-primary w-100" onclick="loadDestinations()">Filter</button>
    </div>
  </div>
  <div class="row g-4" id="destGrid">
    <div class="col-12 text-center text-muted">Loading...</div>
  </div>
</div>

<footer class="bg-dark text-white py-4 mt-auto">
  <div class="container text-center"><p class="mb-0 small">&copy; 2026 TravelBooking</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
async function loadDestinations() {
  const search = document.getElementById("searchInput").value;
  const country = document.getElementById("countryFilter").value;
  let path = "/api/destinations?";
  if (search) path += `search=${encodeURIComponent(search)}&`;
  if (country) path += `country=${encodeURIComponent(country)}&`;
  const grid = document.getElementById("destGrid");
  try {
    const dests = await api(path);
    if (!dests.length) {
      grid.innerHTML = `<div class="col-12 text-center text-muted">No destinations found.</div>`;
      return;
    }
    grid.innerHTML = dests.map(d => `
      <div class="col-md-6 col-lg-4">
        <div class="card dest-card h-100">
          <img src="${d.image_url || 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=600'}" class="card-img-top" alt="${d.name}">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">${d.name}</h5>
            <p class="text-muted small mb-1"><i class="bi bi-flag"></i> ${d.country}</p>
            <p class="small flex-grow-1">${(d.description || '').substring(0, 100)}...</p>
            <div class="d-flex justify-content-between align-items-center">
              <span class="price-tag">From $${d.starting_price}</span>
              <a href="hotels.html?location=${encodeURIComponent(d.name)}" class="btn btn-sm btn-primary">Explore</a>
            </div>
          </div>
        </div>
      </div>
    `).join("");
  } catch (e) {
    grid.innerHTML = `<div class="col-12 text-center text-danger">${e.message}</div>`;
  }
}
loadDestinations();
</script>
</body>
</html>

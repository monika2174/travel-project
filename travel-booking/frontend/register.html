<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register – TravelBooking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-globe2"></i> TravelBooking</a>
  </div>
</nav>

<div class="container flex-grow-1 d-flex align-items-center py-5">
  <div class="row justify-content-center w-100">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow border-0">
        <div class="card-body p-4">
          <h3 class="text-center mb-4">Create Account</h3>
          <div id="alertBox"></div>
          <form id="registerForm">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" id="full_name" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-control" id="phone">
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" id="password" required minlength="6">
            </div>
            <div class="mb-3">
              <label class="form-label">Confirm Password</label>
              <input type="password" class="form-control" id="confirm_password" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Role</label>
              <select class="form-select" id="role">
                <option value="customer">Customer</option>
                <option value="manager">Hotel / Trip Manager</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="regBtn">Register</button>
          </form>
          <p class="text-center mt-3 mb-0 small">
            Already have an account? <a href="login.html">Login</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pwd = document.getElementById("password").value;
  const confirm = document.getElementById("confirm_password").value;
  const alertBox = document.getElementById("alertBox");
  if (pwd !== confirm) {
    alertBox.innerHTML = `<div class="alert alert-danger py-2">Passwords do not match</div>`;
    return;
  }
  const btn = document.getElementById("regBtn");
  btn.disabled = true;
  btn.textContent = "Creating...";
  try {
    await api("/api/auth/register", {
      method: "POST",
      body: JSON.stringify({
        full_name: document.getElementById("full_name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value || null,
        password: pwd,
        role: document.getElementById("role").value
      })
    });
    alertBox.innerHTML = `<div class="alert alert-success py-2">Account created! Redirecting to login...</div>`;
    setTimeout(() => location.href = "login.html", 1500);
  } catch (err) {
    alertBox.innerHTML = `<div class="alert alert-danger py-2">${err.message}</div>`;
    btn.disabled = false;
    btn.textContent = "Register";
  }
});
</script>
</body>
</html>

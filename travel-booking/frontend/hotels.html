<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotels – TravelBooking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-globe2"></i> TravelBooking</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
        <li class="nav-item"><a class="nav-link active" href="hotels.html">Hotels</a></li>
        <li class="nav-item"><a class="nav-link" href="trips.html">Trips</a></li>
      </ul>
      <div id="authButtons">
        <a href="login.html" class="btn btn-outline-light btn-sm me-2">Login</a>
        <a href="register.html" class="btn btn-primary btn-sm">Register</a>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h2 class="mb-4">Hotels</h2>
  <div class="row g-2 mb-4">
    <div class="col-md-3"><input type="text" class="form-control" id="location" placeholder="Location"></div>
    <div class="col-md-2">
      <select class="form-select" id="stars">
        <option value="">Any stars</option>
        <option value="3">3+</option>
        <option value="4">4+</option>
        <option value="5">5</option>
      </select>
    </div>
    <div class="col-md-2">
      <select class="form-select" id="hotelType">
        <option value="">Any type</option>
        <option value="resort">Resort</option>
        <option value="boutique">Boutique</option>
        <option value="luxury">Luxury</option>
      </select>
    </div>
    <div class="col-md-3"><input type="text" class="form-control" id="search" placeholder="Search name..."></div>
    <div class="col-md-2"><button class="btn btn-primary w-100" onclick="loadHotels()">Filter</button></div>
  </div>
  <div class="row g-4" id="hotelGrid">
    <div class="col-12 text-center text-muted">Loading hotels...</div>
  </div>
</div>

<footer class="bg-dark text-white py-4 mt-auto">
  <div class="container text-center"><p class="mb-0 small">&copy; 2026 TravelBooking</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
const params = new URLSearchParams(location.search);
if (params.get("location")) document.getElementById("location").value = params.get("location");

async function loadHotels() {
  let path = "/api/hotels?";
  const loc = document.getElementById("location").value;
  const stars = document.getElementById("stars").value;
  const type = document.getElementById("hotelType").value;
  const search = document.getElementById("search").value;
  if (loc) path += `location=${encodeURIComponent(loc)}&`;
  if (stars) path += `star_rating=${stars}&`;
  if (type) path += `hotel_type=${encodeURIComponent(type)}&`;
  if (search) path += `search=${encodeURIComponent(search)}&`;
  const grid = document.getElementById("hotelGrid");
  try {
    const hotels = await api(path);
    if (!hotels.length) {
      grid.innerHTML = `<div class="col-12 text-center text-muted">No hotels found.</div>`;
      return;
    }
    grid.innerHTML = hotels.map(h => `
      <div class="col-md-6 col-lg-4">
        <div class="card hotel-card h-100">
          <img src="${h.image_url || 'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=600'}" class="card-img-top" alt="${h.name}">
          <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between">
              <h5 class="card-title mb-1">${h.name}</h5>
              <button class="btn btn-link p-0 favorite-btn" onclick="toggleFav(${h.id})" title="Favorite">
                <i class="bi bi-heart"></i>
              </button>
            </div>
            <p class="text-muted small mb-1"><i class="bi bi-geo-alt"></i> ${h.location || ''}</p>
            <div class="review-stars mb-2">${starsHtml(h.star_rating)} <span class="text-muted small">(${h.star_rating}★)</span></div>
            <span class="badge bg-secondary mb-2 align-self-start">${h.hotel_type || 'Hotel'}</span>
            <div class="mt-auto d-flex gap-2">
              <a href="hotel-details.html?id=${h.id}" class="btn btn-outline-primary btn-sm flex-fill">Details</a>
              <a href="hotel-details.html?id=${h.id}#book" class="btn btn-primary btn-sm flex-fill">Book Now</a>
            </div>
          </div>
        </div>
      </div>
    `).join("");
  } catch (e) {
    grid.innerHTML = `<div class="col-12 text-center text-danger">${e.message}</div>`;
  }
}

async function toggleFav(hotelId) {
  if (!getToken()) { location.href = "login.html"; return; }
  try {
    await api("/api/favorites", { method: "POST", body: JSON.stringify({ hotel_id: hotelId }) });
    alert("Added to favorites!");
  } catch (e) {
    alert(e.message);
  }
}

loadHotels();
</script>
</body>
</html>

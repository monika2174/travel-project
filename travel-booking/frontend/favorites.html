<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Favorites – TravelBooking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-globe2"></i> TravelBooking</a>
    <div class="ms-auto" id="authButtons"></div>
  </div>
</nav>

<div class="container py-4">
  <h2 class="mb-4">My Favorites</h2>
  <div id="favList" class="row g-4">
    <div class="col-12 text-center text-muted">Loading...</div>
  </div>
</div>

<footer class="bg-dark text-white py-4 mt-auto">
  <div class="container text-center"><p class="mb-0 small">&copy; 2026 TravelBooking</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
if (!requireAuth()) throw new Error("auth");

async function load() {
  const list = document.getElementById("favList");
  try {
    const favs = await api("/api/favorites");
    if (!favs.length) {
      list.innerHTML = `<div class="col-12 text-center text-muted">No favorites yet. Browse hotels and trips to save them.</div>`;
      return;
    }
    const cards = await Promise.all(favs.map(async (f) => {
      if (f.hotel_id) {
        try {
          const h = await api(`/api/hotels/${f.hotel_id}`);
          return `<div class="col-md-4"><div class="card h-100">
            <img src="${h.image_url || ''}" class="card-img-top" style="height:160px;object-fit:cover">
            <div class="card-body">
              <h5>${h.name}</h5>
              <a href="hotel-details.html?id=${h.id}" class="btn btn-sm btn-primary">View</a>
              <button class="btn btn-sm btn-outline-danger" onclick="removeFav(${f.id})">Remove</button>
            </div></div></div>`;
        } catch { return ""; }
      }
      if (f.trip_id) {
        try {
          const t = await api(`/api/trips/${f.trip_id}`);
          return `<div class="col-md-4"><div class="card h-100">
            <img src="${t.image_url || ''}" class="card-img-top" style="height:160px;object-fit:cover">
            <div class="card-body">
              <h5>${t.title}</h5>
              <a href="trip-details.html?id=${t.id}" class="btn btn-sm btn-primary">View</a>
              <button class="btn btn-sm btn-outline-danger" onclick="removeFav(${f.id})">Remove</button>
            </div></div></div>`;
        } catch { return ""; }
      }
      return "";
    }));
    list.innerHTML = cards.join("") || `<div class="col-12 text-muted">No items to show.</div>`;
  } catch (e) {
    list.innerHTML = `<div class="col-12 text-danger">${e.message}</div>`;
  }
}

async function removeFav(id) {
  try {
    await api(`/api/favorites/${id}`, { method: "DELETE" });
    load();
  } catch (e) {
    alert(e.message);
  }
}

load();
</script>
</body>
</html>

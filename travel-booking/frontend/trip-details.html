<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trip Details – TravelBooking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-globe2"></i> TravelBooking</a>
    <div class="ms-auto" id="authButtons">
      <a href="login.html" class="btn btn-outline-light btn-sm me-2">Login</a>
      <a href="register.html" class="btn btn-primary btn-sm">Register</a>
    </div>
  </div>
</nav>

<div class="container py-4" id="content">
  <div class="text-center text-muted py-5">Loading trip...</div>
</div>

<footer class="bg-dark text-white py-4 mt-auto">
  <div class="container text-center"><p class="mb-0 small">&copy; 2026 TravelBooking</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
const tripId = new URLSearchParams(location.search).get("id");
if (!tripId) location.href = "trips.html";

async function load() {
  try {
    const trip = await api(`/api/trips/${tripId}`);
    const itineraries = await api(`/api/trips/${tripId}/itineraries`).catch(() => []);
    const reviews = await api(`/api/reviews?trip_id=${tripId}`).catch(() => []);

    document.getElementById("content").innerHTML = `
      <div class="row">
        <div class="col-lg-8">
          <img src="${trip.image_url || 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=1000'}" class="img-fluid rounded-3 mb-3 w-100" style="max-height:400px;object-fit:cover" alt="">
          <h2>${trip.title}</h2>
          <p class="text-muted">${trip.duration_days} days · ${trip.trip_type || 'Package'} · <span class="price-tag">$${trip.price}</span> per person</p>
          <p>${trip.description || ''}</p>
          <div class="row mt-3">
            <div class="col-md-6">
              <h5>Included</h5>
              <p class="small">${trip.included || 'See package details'}</p>
            </div>
            <div class="col-md-6">
              <h5>Excluded</h5>
              <p class="small">${trip.excluded || 'Flights & personal expenses'}</p>
            </div>
          </div>
          <h4 class="mt-4">Itinerary</h4>
          ${itineraries.length ? itineraries.map(it => `
            <div class="border-start border-primary border-3 ps-3 mb-3">
              <strong>Day ${it.day_number}: ${it.title || ''}</strong>
              <p class="small mb-0">${it.description || ''}</p>
            </div>
          `).join("") : '<p class="text-muted">Itinerary will be provided after booking.</p>'}
          <h4 class="mt-4">Reviews</h4>
          ${reviews.length ? reviews.map(r => `
            <div class="border-bottom py-2">
              <div class="review-stars">${starsHtml(r.rating)}</div>
              <strong>${r.title || 'Review'}</strong>
              <p class="small mb-0">${r.description || ''}</p>
            </div>
          `).join("") : '<p class="text-muted">No reviews yet.</p>'}
        </div>
        <div class="col-lg-4">
          <div class="booking-summary sticky-top" style="top:80px">
            <h5>Book this trip</h5>
            <p class="price-tag mb-3">$${trip.price} <small class="text-muted fw-normal">/ person</small></p>
            <div class="mb-2">
              <label class="form-label small">Travel date</label>
              <input type="date" class="form-control" id="travelDate">
            </div>
            <div class="mb-2">
              <label class="form-label small">Travelers</label>
              <input type="number" class="form-control" id="travelers" value="1" min="1">
            </div>
            <div class="mb-3" id="tripPricePreview"></div>
            <button class="btn btn-primary w-100" onclick="bookTrip(${trip.price})">Confirm Booking</button>
            <div id="bookAlert" class="mt-2"></div>
          </div>
        </div>
      </div>
    `;

    document.getElementById("travelers").addEventListener("input", () => {
      const n = parseInt(document.getElementById("travelers").value) || 1;
      document.getElementById("tripPricePreview").innerHTML = `<strong>Total: $${(n * trip.price).toFixed(2)}</strong>`;
    });
    document.getElementById("travelers").dispatchEvent(new Event("input"));
  } catch (e) {
    document.getElementById("content").innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
  }
}

async function bookTrip(price) {
  if (!getToken()) { location.href = "login.html"; return; }
  const travelDate = document.getElementById("travelDate").value;
  const travelers = parseInt(document.getElementById("travelers").value) || 1;
  const alertEl = document.getElementById("bookAlert");
  if (!travelDate) {
    alertEl.innerHTML = `<div class="alert alert-warning py-2">Select a travel date</div>`;
    return;
  }
  try {
    const booking = await api("/api/trip-bookings", {
      method: "POST",
      body: JSON.stringify({ trip_id: parseInt(tripId), travel_date: travelDate, travelers })
    });
    alertEl.innerHTML = `<div class="alert alert-success py-2">Booking created! Total: $${booking.total_price}. Status: ${booking.status}</div>`;
  } catch (e) {
    alertEl.innerHTML = `<div class="alert alert-danger py-2">${e.message}</div>`;
  }
}

load();
</script>
</body>
</html>
